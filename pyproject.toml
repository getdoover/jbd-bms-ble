[project]
name = "jbd-bms-ble"
version = "0.1.0"
description = "Doover device app that reads and configures a JBD / Xiaoxiang Bluetooth BMS (iTechworld and most LiFePO4 batteries with a Bluetooth app)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.15.1",
    "bleak>=0.22.3",
]

[project.scripts]
doover-app-run = "jbd_bms_ble:main"
export-config = "jbd_bms_ble.app_config:export"
export-ui = "jbd_bms_ble.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
    "ruff>=0.5",
]
